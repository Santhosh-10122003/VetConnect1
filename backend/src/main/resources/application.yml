server:
  port: ${PORT:8080}
  # Finish in-flight requests (a booking, a payment) before stopping on a redeploy.
  shutdown: graceful
  # Behind a proxy / load balancer, take the real client address from X-Forwarded-For (the rate limiter keys on it).
  forward-headers-strategy: native
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    # requests that wait for a free thread; beyond this, new connections are refused fast instead of piling up
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}
    keep-alive-timeout: 20s
    max-keep-alive-requests: 200

spring:
  application:
    name: jenni-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vetconnect}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    # Keep (instances x DB_POOL_MAX) below Postgres max_connections. Measure with the k6 tests, then adjust.
    hikari:
      pool-name: jenni-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      # fail in 5 s with a clear error instead of hanging threads for 30 s when the pool is exhausted
      connection-timeout: ${DB_POOL_TIMEOUT_MS:5000}
      # recycle before a proxy / managed Postgres silently closes an idle connection
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}
      idle-timeout: 300000
      # logs a stack trace when code holds a connection longer than this (a leak or a slow query)
      leak-detection-threshold: ${DB_POOL_LEAK_MS:20000}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

vetconnect:
  jwt:
    # In production JWT_SECRET is required (the app refuses to start on the built-in development value).
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
  # Payments: "simulated" (test buttons, no money) or "razorpay". For Razorpay set the three RAZORPAY_* values; use
  # rzp_test_ keys to try it without real money, and CARE_CURRENCY=INR (Razorpay accounts are normally in rupees).
  payments:
    gateway: ${PAYMENT_GATEWAY:simulated}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  # Uploaded photos and documents. Point UPLOADS_DIR at a persistent disk in production.
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  # Store links shown on the page a scanned pet QR opens when the app is not installed.
  app:
    android-url: ${APP_ANDROID_URL:}
    ios-url: ${APP_IOS_URL:}
  # What an empty database gets. In production set SEED_DEMO_DATA=false and give the first admin.
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
    admin-phone: ${SEED_ADMIN_PHONE:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
  care:
    currency: ${CARE_CURRENCY:USD}
    currency-symbol: ${CARE_CURRENCY_SYMBOL:$}
  clinic:
    advance-percent: ${CLINIC_ADVANCE_PERCENT:50}

  # Per-client request limits (in memory, per instance). Set RATE_LIMIT_ENABLED=false for a single-IP load test.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:300}
  # Demo data for load tests (profile "loadtest" only): accounts +91 9000000001.. / password LoadTest@123
  loadtest:
    customers: ${LOADTEST_CUSTOMERS:2000}
    doctors: ${LOADTEST_DOCTORS:100}
    past-appointments: ${LOADTEST_PAST_APPOINTMENTS:5000}

# Operations endpoints. Only health is public; metrics need an admin token (or keep the port private).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  file:
    name: ${LOG_FILE:logs/jenni.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.vetconnect: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
